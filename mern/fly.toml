# APMC Yard Management — Fly.io config
# Single app: Express serves both /api and the built React frontend.
# Run `fly launch --no-deploy` once to create the app, then `fly deploy`.

app = "apmc-yard"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "8080"
  LOG_LEVEL = "info"
  # Set these secrets (never commit real values):
  #   fly secrets set MONGODB_URI="..." JWT_SECRET="..." CLIENT_ORIGIN="https://apmc-yard.fly.dev"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus     = 1
